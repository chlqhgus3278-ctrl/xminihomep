server:
  # Render 등 PaaS는 리스닝 포트를 PORT 환경변수로 주입한다.
  port: ${PORT:8080}

spring:
  application:
    name: xminihomep-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
            redirect-uri: ${app.url}/login/oauth2/code/google

app:
  url: ${APP_URL:http://localhost:8080}
  # 로그인 성공 후 토큰을 들려 보낼 곳. 한 곳만 지정할 수 있다.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # 쉼표로 여러 오리진을 허용한다 (Pages 미리보기 도메인 등). 미지정 시 frontend-url만 허용.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-32bytes-min}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  upload:
    image-max-size-bytes: ${IMAGE_MAX_SIZE_BYTES:5242880}   # 5MB
    bgm-max-size-bytes: ${BGM_MAX_SIZE_BYTES:20971520}      # 20MB

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:}
    public-url: ${R2_PUBLIC_URL:}
