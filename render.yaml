# Render Blueprint — 백엔드(Spring Boot)만 배포한다.
# 프론트는 Cloudflare Pages, DB는 Neon, 파일은 Cloudflare R2를 쓴다.
# 대시보드에서 New > Blueprint 로 이 파일을 읽히면 서비스가 생성된다.
services:
  - type: web
    name: folio-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # 자동 생성(256비트). JJWT의 HS256은 32바이트 이상을 요구한다.
      - key: JWT_SECRET
        generateValue: true

      # 아래는 값이 환경마다 달라 대시보드에서 직접 입력한다 (sync: false).
      # DATABASE_URL은 반드시 JDBC 형식이어야 한다:
      #   jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # 이 서비스 자신의 공개 주소. 구글 OAuth 리다이렉트 URI가 여기서 파생된다.
      #   예) https://folio-backend.onrender.com
      - key: APP_URL
        sync: false
      # 로그인 성공 후 토큰을 들려 보낼 프론트 주소 (Cloudflare Pages)
      - key: FRONTEND_URL
        sync: false
      # 선택: Pages 미리보기 도메인까지 허용하려면 쉼표로 나열
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
